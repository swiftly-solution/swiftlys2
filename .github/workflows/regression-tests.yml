name: Regression Tests

on:
  push:
    branches: [beta]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  managed:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/managed/SwiftlyS2.RegressionTests.csproj -c Release
        timeout-minutes: 5

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tests/native/run_tests.py
        timeout-minutes: 5
